name: iOS CI & Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios.yml'
    branches: [ main ]
  pull_request:
    paths:
      - 'shared/**'
      - 'iosApp/**'
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Kotlin Multiplatform XCFramework
        run: ./gradlew :shared:assembleSharedKitReleaseXCFramework

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || true

      - name: Build iOS Simulator (Debug)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator,name=iPhone 15' \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Build iOS Device (Release Unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package Payload / .ipa for Testing
        run: |
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/iosApp.app Payload/ || true
          if [ -d "Payload/iosApp.app" ]; then
            zip -r CineList-iOS-unsigned.ipa Payload
            echo "IPA generated successfully"
          fi

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinelist-ios-build
          path: |
            CineList-iOS-unsigned.ipa
            ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphonesimulator/iosApp.app
          if-no-files-found: warn
