name: Publicar Atualização OTA CineList

on:
  push:
    tags:
      - 'v*' # Dispara automaticamente quando você envia tags como v1.0.1, v1.1.0, etc.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restaurar Keystore a partir do Secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "import os, base64; open('app/cinelist-key.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_B64']))"

      - name: Conceder permissao de execucao ao Gradle
        run: chmod +x ./gradlew

      - name: Gerar local.properties para a compilação
        run: |
          echo "tmdb.token=${{ secrets.TMDB_TOKEN }}" > local.properties

      - name: Compilar APK de Release Assinado
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Renomear APK gerado
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CineList-${{ github.ref_name }}.apk

      - name: Extrair notas da versao
        id: extrair_notas
        run: |
          python3 -c "
          import json, os
          notas = 'Novas melhorias, correcoes e novidades adicionadas nesta versao.'
          try:
              if os.path.exists('atualizacao/versao.json'):
                  with open('atualizacao/versao.json', 'r', encoding='utf-8') as f:
                      d = json.load(f)
                      val = d.get('notas') or d.get('changelog')
                      if val and val.strip():
                          notas = val.strip()
              elif os.path.exists('version.json'):
                  with open('version.json', 'r', encoding='utf-8') as f:
                      d = json.load(f)
                      val = d.get('changelog') or d.get('notas')
                      if val and val.strip():
                          notas = val.strip()
          except Exception as e:
              print('Erro ao carregar notas:', e)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              notas_clean = notas.replace('\r\n', ' // ').replace('\n', ' // ')
              out.write(f'notas={notas_clean}\n')
          "

      - name: Criar Release no GitHub
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/CineList-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: CineList ${{ github.ref_name }}
          body: ${{ steps.extrair_notas.outputs.notas }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar version.json
        run: |
          TAG="${{ github.ref_name }}"
          VERSAO_NOME="${TAG#v}"
          VERSION_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' || date +%s)
          APK_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/CineList-$TAG.apk"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Muda para a branch main e sincroniza antes de tocar em qualquer arquivo
          git checkout main
          git pull origin main

          # 2. Atualiza version.json e atualizacao/versao.json preservando as notas reais do changelog
          python3 -c "
          import json, os

          notas = 'Novas melhorias, correções e novidades adicionadas nesta versão.'
          try:
              if os.path.exists('atualizacao/versao.json'):
                  with open('atualizacao/versao.json', 'r', encoding='utf-8') as f:
                      d = json.load(f)
                      val = d.get('notas') or d.get('changelog')
                      if val and val.strip():
                          notas = val.strip()
              elif os.path.exists('version.json'):
                  with open('version.json', 'r', encoding='utf-8') as f:
                      d = json.load(f)
                      val = d.get('changelog') or d.get('notas')
                      if val and val.strip():
                          notas = val.strip()
          except Exception as e:
              print('Erro ao carregar notas:', e)

          data_version = {
              'versionCode': int('$VERSION_CODE'),
              'versionName': '$VERSAO_NOME',
              'apkUrl': '$APK_URL',
              'changelog': notas
          }
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data_version, f, indent=2, ensure_ascii=False)

          data_atualizacao = {
              'versaoCodigo': int('$VERSION_CODE'),
              'versaoNome': '$VERSAO_NOME',
              'notas': notas,
              'apkUrl': '$APK_URL'
          }
          os.makedirs('atualizacao', exist_ok=True)
          with open('atualizacao/versao.json', 'w', encoding='utf-8') as f:
              json.dump(data_atualizacao, f, indent=2, ensure_ascii=False)
          "

          # 3. Commita e envia diretamente para a branch main
          git add version.json atualizacao/versao.json
          git commit -m "Auto: Atualiza version.json para $TAG [skip ci]" || echo "Nenhuma alteração no version.json"
          git push origin main
